name: glass_calc_1
description: "A new Flutter project."
publish_to: 'none'

version: 2.2.0+5

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/calculator-2017-10-10.png"
  # Adaptive icon settings for modern Android launchers
  adaptive_icon_background: "#D0D0D0" # Matches the light grey background of your icon
  adaptive_icon_foreground: "assets/icon/calculator-2017-10-10.png"
